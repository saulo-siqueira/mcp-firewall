services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcp_firewall
      POSTGRES_USER: mcp_firewall
      POSTGRES_PASSWORD: mcp_firewall
    volumes:
      - postgres-data:/var/lib/postgresql/data
  mcp-firewall:
    build: .
    depends_on:
      - postgres
    ports:
      - "3210:3210"
    volumes:
      - ./mcp-firewall.yaml:/app/mcp-firewall.yaml:rw
      - firewall-data:/app/data
    environment:
      STORAGE_PATH: /app/data/state.json
      DATABASE_URL: postgres://mcp_firewall:mcp_firewall@postgres:5432/mcp_firewall
volumes:
  postgres-data:
  firewall-data:
