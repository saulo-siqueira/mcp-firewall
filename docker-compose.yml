services:
  mcp-firewall:
    build: .
    ports:
      - "3210:3210"
    volumes:
      - ./mcp-firewall.yaml:/app/mcp-firewall.yaml:ro
    command: ["node", "--input-type=module", "-e", "import { Firewall, createApiServer } from './src/index.js'; const firewall = new Firewall(); createApiServer(firewall).listen(3210, '0.0.0.0', () => console.log('MCP Firewall dashboard running at http://localhost:3210/api/dashboard'));" ]
